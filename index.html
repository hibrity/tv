<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TVG — TV e Rádio</title>
<meta name="theme-color" content="#0a1929"/>
<link rel="icon" type="image/svg+xml" href="/tv/icon.svg"/>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TVG">

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f0f;--card:#1a2d42;--card2:#0a1929;--border:#2a4a6b;
  --txt:#f1f5f9;--accent:#4CAF50;--bar:#0d2137;--btn-nav:#007bff;--btn-nav-hover:#0056b3;
  --radio-accent:#00ff88
}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--txt);height:100vh;overflow:hidden}

.app-layout{
  display:flex;flex-direction:column;
  height:calc(100vh - 112px);
  position:relative;
  overflow:hidden;
  margin-bottom:0;
  padding-bottom:0;
}

.player-tv{
  order:1;flex-shrink:0;position:relative;
  max-height:0;opacity:0;overflow:hidden;
  transition:all .3s ease;
  background:#000;
  margin:0;
}
.player-tv.visible{max-height:340px;opacity:1}

.player-radio{
  order:1;flex-shrink:0;position:relative;
  max-height:0;opacity:0;overflow:hidden;
  transition:all .3s ease;
  background:radial-gradient(circle at top,#1a3a2e 0%,#0a1a12 60%,#000 100%);
  margin:0;
}
.player-radio.visible{max-height:220px;opacity:1}

.player-top-bar{
  padding:6px 15px;background:rgba(20,20,20,.95);
  display:flex;justify-content:space-between;align-items:center;
  border-bottom:1px solid #333;
}
.channel-info{display:flex;align-items:center;gap:10px}
#current-channel-title{font-size:.9rem;font-weight:600;color:#fff}
.controls{display:flex;gap:6px}
.control-btn{
  background:#333;border:1px solid #444;color:#fff;
  width:32px;height:32px;border-radius:6px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .2s
}
.control-btn:hover{background:var(--accent);border-color:var(--accent)}
.control-btn svg{width:14px;height:14px;fill:currentColor}

.player-content-tv{
  position:relative;width:100%;height:300px;overflow:hidden;
}
.player-content-radio{
  position:relative;width:100%;height:180px;overflow:hidden;
}
#main-iframe{
  position:absolute;top:0;left:0;width:100%;height:100%;
  border:none;opacity:0;transition:opacity .3s ease;z-index:2;
}
#main-iframe.visible{opacity:1}

.radio-visualizer{
  position:absolute;top:0;left:0;width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .3s ease;z-index:1;
}
.player-radio.visible .radio-visualizer{opacity:1}

.wave-ring{position:absolute;border-radius:50%;border:2px solid rgba(0,255,136,.3);animation:pulse 1.2s ease-out infinite}
@keyframes pulse{0%{transform:scale(.4);opacity:.8}100%{transform:scale(1.3);opacity:0}}

.bars-container{display:flex;align-items:center;justify-content:center;gap:4px;height:140px}
.sound-bar{
  width:8px;background:linear-gradient(to top,var(--radio-accent),#88ffcc);
  border-radius:4px;transform-origin:bottom center;
  animation:bounce .5s ease-in-out infinite alternate;
  box-shadow:0 0 8px rgba(0,255,136,.4)
}
@keyframes bounce{0%{transform:scaleY(.1)}100%{transform:scaleY(1)}}

.radio-center-info{position:absolute;bottom:15px;left:0;right:0;text-align:center;color:#fff;text-shadow:0 0 8px rgba(0,255,136,.5)}
.radio-title{font-size:1.2rem;font-weight:bold;color:var(--radio-accent);margin-bottom:4px}
.radio-genre{font-size:.9rem;opacity:.7}

#iframe-container:fullscreen{width:100vw;height:100vh;position:fixed;top:0;left:0;z-index:9999}

.radio-controls-bar{
  order:3;flex-shrink:0;padding:8px 15px;background:linear-gradient(to right,#0f2e23,#0a1a12);
  border-bottom:1px solid #1a3a2e;display:flex;align-items:center;justify-content:center;
  gap:12px;max-height:0;opacity:0;overflow:hidden;transition:all .3s ease;
  margin:0;
}
.radio-controls-bar.visible{max-height:65px;opacity:1}

.radio-control-btn{
  background:rgba(0,255,136,.15);border:1px solid var(--radio-accent);color:var(--radio-accent);
  width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .2s;font-size:18px
}
.radio-control-btn:hover{background:var(--radio-accent);color:#000;box-shadow:0 0 12px rgba(0,255,136,.5)}

.volume-container{display:flex;align-items:center;gap:8px;flex:0 0 160px}
.volume-icon{color:var(--radio-accent);font-size:16px}
.volume-slider{
  flex:1;height:6px;-webkit-appearance:none;appearance:none;background:rgba(0,255,136,.2);
  border-radius:4px;outline:none;cursor:pointer
}
.volume-slider::-webkit-slider-thumb{
  -webkit-appearance:none;width:18px;height:18px;background:var(--radio-accent);border-radius:50%;
  cursor:pointer;box-shadow:0 0 8px rgba(0,255,136,.5)
}
.volume-value{color:var(--radio-accent);font-size:.75rem;min-width:40px;text-align:right}

/* === BARRAS NO RODAPÉ — SEM ESPAÇO ENTRE PLAYER E BARRAS === */
.bars-footer{
  position:fixed;bottom:56px;left:0;right:0;
  background:var(--bar);
  border-top:none;
  margin-top:0;
  padding-top:0;
  z-index:998;
}

.bar-section{
  padding:4px 0;
  margin:0;
  transition:opacity .3s ease, max-height .3s ease, margin .3s ease;
  opacity:1;max-height:200px;overflow:hidden;
}
.bar-section.hidden-bar{opacity:0;max-height:0;margin:0;padding:0}

.bar-header{
  display:flex;justify-content:space-between;align-items:center;
  padding:2px 15px 0;
  margin:0;
}
.bar-label{
  font-size:.75rem;font-weight:600;color:#888;display:flex;align-items:center;gap:6px
}
.close-btn{
  background:transparent;color:#ff6b6b;border:1px solid #ff6b6b;
  padding:1px 8px;border-radius:4px;cursor:pointer;
  font-weight:600;font-size:.7rem;line-height:1.2;transition:all .2s
}
.close-btn:hover{background:#ff6b6b;color:#fff}

.bar-container{display:flex;align-items:center;position:relative;padding:0 8px;gap:6px;margin:0}
.scroll-btn{
  background:var(--btn-nav);color:#fff;border:none;cursor:pointer;
  border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;
  font-size:14px;transition:background .2s;flex-shrink:0
}
.scroll-btn:hover{background:var(--btn-nav-hover)}
.cards-scroll{display:flex;gap:10px;overflow-x:auto;scroll-behavior:smooth;padding:4px 8px;width:100%;margin:0}
.cards-scroll::-webkit-scrollbar{height:3px}
.cards-scroll::-webkit-scrollbar-thumb{background:#3a5f85;border-radius:4px}

.channel-card, .radio-card{
  flex:0 0 85px;background:var(--card);border:2px solid var(--border);
  border-radius:10px;padding:8px;cursor:pointer;transition:all .2s;text-align:center
}
.channel-card:hover, .radio-card:hover{transform:scale(1.05);border-color:var(--accent)}
.channel-card.active, .radio-card.active{border-color:var(--radio-accent);box-shadow:0 0 0 2px rgba(0,255,136,.3)}
.radio-card.loading{opacity:.6;cursor:wait}

.logo-box{
  width:44px;height:44px;margin:0 auto 4px;border-radius:50%;
  background:#ffffff;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  padding:5px;
}
.card-logo{
  max-width:100%;max-height:100%;object-fit:contain;display:block;
  filter:drop-shadow(0 0 2px rgba(0,0,0,.4));
}
.card-init{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.9rem;background:linear-gradient(135deg,#2a4a6b,#1a3a5c);border-radius:8px;color:#fff}
.card-name{font-size:.7rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-genre{font-size:.6rem;color:#888;margin-top:1px}

.hidden-radio-player{position:absolute;left:-9999px;top:-9999px;opacity:0;pointer-events:none}

.bottom-bar{
  position:fixed;bottom:0;left:0;right:0;height:56px;
  background:var(--bar);border-top:1px solid #1a3a5c;
  display:flex;align-items:center;justify-content:center;z-index:999
}
#pwa_btn{
  background:transparent;color:var(--accent);border:none;
  padding:10px 24px;font-weight:700;font-size:14px;cursor:pointer;
  display:flex;align-items:center;gap:8px;transition:all .2s;border-radius:8px
}
#pwa_btn:hover{background:rgba(76,175,80,.1)}
#pwa_btn.hidden{display:none !important}

@media(max-width:768px){
  .channel-card, .radio-card{flex:0 0 75px}
  .player-content-tv{height:240px}
  .player-tv.visible{max-height:280px}
  .volume-container{flex:0 0 130px}
  .app-layout{height:calc(100vh - 112px)}
}
</style>
</head>
<body>

<div class="app-layout">
  <div class="player-tv" id="playerTv">
    <div class="player-top-bar">
      <div class="channel-info">
        <span style="color:var(--accent);font-size:.9rem">●</span>
        <span id="current-channel-title">—</span>
      </div>
      <div class="controls">
        <button class="control-btn" title="Tela Cheia" onclick="toggleFullscreen()">
          <svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
        </button>
      </div>
    </div>
    <div class="player-content-tv" id="iframe-container">
      <iframe id="main-iframe" src="" allow="autoplay; encrypted-media; fullscreen" allowfullscreen referrerpolicy="no-referrer"></iframe>
    </div>
  </div>

  <div class="player-radio" id="playerRadio">
    <div class="player-content-radio">
      <div class="radio-visualizer">
        <div class="wave-ring" style="width:80px;height:80px;animation-delay:0s"></div>
        <div class="wave-ring" style="width:120px;height:120px;animation-delay:.2s"></div>
        <div class="wave-ring" style="width:160px;height:160px;animation-delay:.4s"></div>
        <div class="wave-ring" style="width:200px;height:200px;animation-delay:.6s"></div>
        <div class="bars-container" id="barsContainer"></div>
        <div class="radio-center-info">
          <div class="radio-title" id="radioNameDisplay">—</div>
          <div class="radio-genre" id="radioGenreDisplay">—</div>
        </div>
      </div>
    </div>
  </div>

  <div class="radio-controls-bar" id="radioControlsBar">
    <button class="radio-control-btn" id="playPauseBtn" onclick="alternarPlay()">▶</button>
    <div class="volume-container">
      <span class="volume-icon" id="volIcon">🔊</span>
      <input type="range" class="volume-slider" id="volSlider" min="0" max="100" value="80">
      <span class="volume-value" id="volValue">80%</span>
    </div>
    <button class="radio-control-btn" id="mudoBtn" onclick="alternarMudo()">🔇</button>
  </div>
</div>

<div class="bars-footer">
  <div class="bar-section" id="tvBar">
    <div class="bar-header">
      <div class="bar-label">📺 Canais TV</div>
      <button class="close-btn" onclick="fecharTv()">✖</button>
    </div>
    <div class="bar-container">
      <button class="scroll-btn" onclick="rolarTv(-200)">&#10094;</button>
      <div class="cards-scroll" id="tvScroll"></div>
      <button class="scroll-btn" onclick="rolarTv(200)">&#10095;</button>
    </div>
  </div>

  <div class="bar-section" id="radioBar">
    <div class="bar-header">
      <div class="bar-label">📻 Rádios</div>
      <button class="close-btn" onclick="fecharRadio()">✖</button>
    </div>
    <div class="bar-container">
      <button class="scroll-btn" onclick="rolarRadio(-200)">&#10094;</button>
      <div class="cards-scroll" id="radioScroll"></div>
      <button class="scroll-btn" onclick="rolarRadio(200)">&#10095;</button>
    </div>
  </div>
</div>

<div class="hidden-radio-player">
  <audio id="radioPlayer" preload="metadata">
</div>

<div class="bottom-bar">
  <button id="pwa_btn" onclick="pwaInstall()">📲 Instalar TVG</button>
</div>

<script>
const pwaBtn = document.getElementById('pwa_btn');
let pwaDeferred = null;
function checkIfAppMode(){
  if((window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true) || localStorage.getItem('tvg_installed') === 'yes'){
    pwaBtn.classList.add('hidden'); return true;
  }
  return false;
}
function markAsInstalled(){ localStorage.setItem('tvg_installed','yes'); pwaBtn.classList.add('hidden'); }
function pwaManifest(){
  const m={name:'TVG',short_name:'TVG',start_url:'/tv/',display:'standalone',background_color:'#0a1929',theme_color:'#0a1929',icons:[{src:'/tv/icon.svg',sizes:'512x512',type:'image/svg+xml'}]};
  const b=new Blob([JSON.stringify(m)],{type:'application/manifest+json'});
  let l=document.getElementById('pwa_manifest');
  if(!l){l=document.createElement('link');l.id='pwa_manifest';l.rel='manifest';document.head.appendChild(l);}
  l.href=URL.createObjectURL(b);
}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();pwaDeferred=e;checkIfAppMode();});
window.addEventListener('appinstalled',markAsInstalled);

const playerTv = document.getElementById('playerTv');
const playerRadio = document.getElementById('playerRadio');
const radioControlsBar = document.getElementById('radioControlsBar');
const mainIframe = document.getElementById('main-iframe');
const tvBar = document.getElementById('tvBar');
const radioBar = document.getElementById('radioBar');
const currentChannelTitle = document.getElementById('current-channel-title');
const radioNameDisplay = document.getElementById('radioNameDisplay');
const radioGenreDisplay = document.getElementById('radioGenreDisplay');
const audio = document.getElementById('radioPlayer');
const volSlider = document.getElementById('volSlider');
const volValue = document.getElementById('volValue');
const volIcon = document.getElementById('volIcon');
const playPauseBtn = document.getElementById('playPauseBtn');

let currentRadio = null, currentCard = null, isLoading = false;
let ultimoVolumeSalvo = 80, animacaoRodando = false;

window.addEventListener('DOMContentLoaded', () => {
  pwaManifest(); checkIfAppMode();
  inicializarVolume(); montarBarrasSom();
  renderCanais(); renderRadios();
  tvBar.classList.remove('hidden-bar');
  radioBar.classList.remove('hidden-bar');
});

function inicializarVolume(){
  audio.volume = 0.8; volSlider.value = 80; volValue.textContent = '80%'; volIcon.textContent = '🔊';
  volSlider.addEventListener('input', () => {
    const v = parseInt(volSlider.value);
    audio.volume = v / 100; volValue.textContent = v + '%';
    volIcon.textContent = v === 0 ? '🔇' : v < 40 ? '🔉' : '🔊';
    if(v > 0) ultimoVolumeSalvo = v;
  });
}
function alternarMudo(){
  if(audio.volume > 0){
    ultimoVolumeSalvo = Math.round(audio.volume * 100);
    audio.volume = 0; volSlider.value = 0; volValue.textContent = '0%'; volIcon.textContent = '🔇';
  } else {
    audio.volume = ultimoVolumeSalvo / 100;
    volSlider.value = ultimoVolumeSalvo; volValue.textContent = ultimoVolumeSalvo + '%';
    volIcon.textContent = ultimoVolumeSalvo < 40 ? '🔉' : '🔊';
  }
}
function alternarPlay(){
  if(!currentRadio) return;
  if(audio.paused){
    audio.play().then(()=>{playPauseBtn.textContent='⏸';if(currentCard)currentCard.classList.add('active');iniciarVisualizador();});
  }else{
    audio.pause(); playPauseBtn.textContent='▶';if(currentCard)currentCard.classList.remove('active');pararVisualizador();
  }
}

function montarBarrasSom(){
  const c=document.getElementById('barsContainer'); c.innerHTML='';
  for(let i=0;i<20;i++){
    const b=document.createElement('div');b.className='sound-bar';b.style.height='20px';b.style.animationDelay=(i*.05)+'s';c.appendChild(b);
  }
}
function atualizarBarras(){
  for(const b of document.getElementById('barsContainer').children) b.style.height=(Math.random()*100+20)+'px';
  if(animacaoRodando) requestAnimationFrame(atualizarBarras);
}
function iniciarVisualizador(){animacaoRodando=true;atualizarBarras()}
function pararVisualizador(){animacaoRodando=false;for(const b of document.getElementById('barsContainer').children)b.style.height='20px'}

function abrirTv(canal){
  fecharTudo();
  playerTv.classList.add('visible');
  mainIframe.classList.add('visible');
  mainIframe.src = 'https://sinalpublicoetv.vercel.app/?id=' + canal.id;
  currentChannelTitle.textContent = canal.nome;
  tvBar.classList.remove('hidden-bar');
  radioBar.classList.add('hidden-bar');
}

function abrirRadio(radio, card){
  if(isLoading) return;
  if(currentCard === card && currentRadio && !audio.paused){ alternarPlay(); return; }
  fecharTudo();
  isLoading = true;
  currentCard = card; card.classList.add('active','loading');
  currentRadio = radio;
  radioNameDisplay.textContent = radio.nome;
  radioGenreDisplay.textContent = radio.genero;
  
  audio.pause(); audio.src = radio.url; audio.load();
  audio.play().then(()=>{
    isLoading = false; card.classList.remove('loading');
    playPauseBtn.textContent='⏸';
    playerRadio.classList.add('visible');
    radioControlsBar.classList.add('visible');
    tvBar.classList.add('hidden-bar');
    radioBar.classList.remove('hidden-bar');
    iniciarVisualizador();
  }).catch(()=>{isLoading=false;alert('Clique em ▶ para ouvir');});
}

function fecharTudo(){
  playerTv.classList.remove('visible');
  playerRadio.classList.remove('visible');
  radioControlsBar.classList.remove('visible');
  mainIframe.src = ''; mainIframe.classList.remove('visible');
  if(!audio.paused){ audio.pause(); playPauseBtn.textContent='▶'; pararVisualizador(); }
  document.querySelectorAll('.channel-card, .radio-card').forEach(c=>c.classList.remove('active','loading'));
  currentRadio = currentCard = null;
  tvBar.classList.remove('hidden-bar');
  radioBar.classList.remove('hidden-bar');
}

function fecharTv(){
  playerTv.classList.remove('visible');
  mainIframe.src = ''; mainIframe.classList.remove('visible');
  tvBar.classList.add('hidden-bar');
  radioBar.classList.remove('hidden-bar');
}

function fecharRadio(){
  if(!audio.paused){ audio.pause(); playPauseBtn.textContent='▶'; pararVisualizador(); }
  playerRadio.classList.remove('visible');
  radioControlsBar.classList.remove('visible');
  document.querySelectorAll('.radio-card').forEach(c=>c.classList.remove('active','loading'));
  currentRadio = currentCard = null;
  radioBar.classList.add('hidden-bar');
  tvBar.classList.remove('hidden-bar');
}

function toggleFullscreen(){
  const c=document.getElementById('iframe-container');
  document.fullscreenElement?document.exitFullscreen?.():c.requestFullscreen?.().catch(()=>{});
}

const tvScroll=document.getElementById('tvScroll');
const radioScroll=document.getElementById('radioScroll');
function rolarTv(qtd){tvScroll.scrollBy({left:qtd,behavior:'smooth'})}
function rolarRadio(qtd){radioScroll.scrollBy({left:qtd,behavior:'smooth'})}

function renderCanais(){
  tvScroll.innerHTML="";
  channelData.forEach(ch=>{
    const card=document.createElement('div');card.className='channel-card';
    const logoUrl=getLogoUrl(ch.id);
    const init=ch.nome.replace(/[^a-zA-Z]/g,'').substring(0,2).toUpperCase()||'TV';
    card.innerHTML=`
      <div class="logo-box">
        ${logoUrl?`<img src="${logoUrl}" alt="${ch.nome}" class="card-logo" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
        <div class="card-init" style="display:none">${init}</div>`:`<div class="card-init">${init}</div>`}
      </div>
      <div class="card-name">${ch.nome}</div>
    `;
    card.onclick=()=>abrirTv(ch);
    tvScroll.appendChild(card);
  });
}

function renderRadios(){
  radioScroll.innerHTML="";
  radios.forEach(r=>{
    const logoUrl=getLogoUrl(r.id);
    const inic=r.nome.split(' ').map(p=>p[0]).join('').substring(0,2).toUpperCase();
    const card=document.createElement('div');card.className='radio-card';
    card.innerHTML=`
      <div class="logo-box">
        ${logoUrl?`<img src="${logoUrl}" alt="${r.nome}" class="card-logo" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
        <div class="card-init" style="background:${r.cor};display:none">${inic}</div>`:`<div class="card-init" style="background:${r.cor}">${inic}</div>`}
      </div>
      <div class="card-name">${r.nome}</div>
      <div class="card-genre">${r.genero}</div>
    `;
    card.onclick=()=>abrirRadio(r,card);
    radioScroll.appendChild(card);
  });
}

audio.addEventListener('error',()=>{
  isLoading=false;
  if(currentCard) currentCard.classList.remove('loading','active');
  alert('Erro — tente outra rádio');
});

function pwaInstall(){
  if(pwaDeferred){
    pwaDeferred.prompt();
    pwaDeferred.userChoice.then(r=>{if(r.outcome==='accepted')markAsInstalled();});
  }else{
    const ios=/iphone|ipad/i.test(navigator.userAgent);
    alert(ios?'Compartilhar → Adicionar à Tela de Início':'Menu ⋮ → Adicionar à tela inicial');
  }
}
