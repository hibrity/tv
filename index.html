<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TVG</title>
<meta name="theme-color" content="#0a1929"/>
<link rel="icon" type="image/svg+xml" href="/tv/icon.svg"/>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TVG">

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f0f;--card:#1a2d42;--card2:#0a1929;--border:#2a4a6b;
  --txt:#f1f5f9;--accent:#4CAF50;--bar:#0d2137;--btn-nav:#007bff;--btn-nav-hover:#0056b3
}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--txt);height:100vh;overflow:hidden}

.app-layout{display:flex;height:calc(100vh - 56px)}
.sidebar{width:420px;background:var(--card2);border-right:1px solid #1a3a5c;display:flex;flex-direction:column;flex-shrink:0}
.sidebar-header{padding:15px;background:var(--bar);border-bottom:1px solid #1a3a5c}
.sidebar-header h2{font-size:1rem;color:#fff;display:flex;align-items:center;gap:8px}

.carousel-container{display:flex;align-items:center;position:relative;padding:16px;gap:10px}

.scroll-btn{
  background:var(--btn-nav);color:#fff;border:none;cursor:pointer;
  z-index:10;border-radius:50%;width:36px;height:36px;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;transition:background .2s;flex-shrink:0;
  box-shadow:0 2px 5px rgba(0,0,0,.2)
}
.scroll-btn:hover{background:var(--btn-nav-hover)}

.cards-wrapper{
  display:flex;gap:12px;overflow-x:auto;scroll-behavior:smooth;
  padding:4px 4px 12px;width:100%;
  scrollbar-width:thin;scrollbar-color:#3a5f85 transparent
}
.cards-wrapper::-webkit-scrollbar{height:6px}
.cards-wrapper::-webkit-scrollbar-thumb{background:#3a5f85;border-radius:4px}
.cards-wrapper::-webkit-scrollbar-track{background:transparent}

.channel-card{
  flex:0 0 100px;background:var(--card);border:2px solid var(--border);
  border-radius:10px;padding-bottom:100px;position:relative;cursor:pointer;
  transition:all .2s;overflow:hidden
}
.channel-card:hover{transform:scale(1.05);border-color:var(--accent)}
.channel-card.active{border-color:var(--accent);box-shadow:0 0 0 2px rgba(76,175,80,.3)}

.logo-container{
  position:absolute;top:0;left:0;width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;padding:8px
}
.channel-logo{max-width:100%;max-height:100%;object-fit:contain;display:block}
.channel-logo-fallback{
  width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:1.4rem;background:linear-gradient(135deg,#2a4a6b,#1a3a5c);
  border-radius:8px;color:#fff;letter-spacing:1px
}

.player-section{flex:1;display:flex;flex-direction:column;background:#000;position:relative}
.player-top-bar{
  padding:12px 20px;background:rgba(20,20,20,.95);backdrop-filter:blur(8px);
  border-bottom:1px solid #333;display:flex;justify-content:space-between;align-items:center
}
.channel-info{display:flex;align-items:center;gap:12px}
#current-channel-title{font-size:1rem;font-weight:600;color:#fff}
.controls{display:flex;gap:8px}
.control-btn{
  background:#333;border:1px solid #444;color:#fff;
  width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .2s
}
.control-btn:hover{background:var(--accent);border-color:var(--accent)}
.control-btn svg{width:16px;height:16px;fill:currentColor}

.iframe-container{flex:1;position:relative;width:100%;height:100%;background:#000}
#main-iframe{width:100%;height:100%;border:none;display:none}
.placeholder-screen{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;color:#888}
.placeholder-screen svg{width:64px;height:64px;margin-bottom:15px;stroke:#444}
#iframe-container:fullscreen{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}
#iframe-container:fullscreen #main-iframe{display:block}

.bottom-bar{
  position:fixed;bottom:0;left:0;right:0;height:56px;
  background:var(--bar);border-top:1px solid #1a3a5c;
  display:flex;align-items:center;justify-content:center;z-index:999
}
#pwa_btn{
  background:transparent;color:var(--accent);border:none;
  padding:10px 24px;font-weight:700;font-size:14px;cursor:pointer;
  display:flex;align-items:center;gap:8px;transition:all .2s;border-radius:8px
}
#pwa_btn:hover{background:rgba(76,175,80,.1)}
#pwa_btn.hidden{display:none !important;}

@media(max-width:768px){
  .app-layout{flex-direction:column;height:calc(100vh - 56px)}
  .sidebar{width:100%;height:45%;order:2}
  .player-section{height:55%;order:1}
  .channel-card{flex:0 0 90px}
  .scroll-btn{width:32px;height:32px;font-size:14px}
}
@media(max-width:400px){
  .channel-card{flex:0 0 80px}
}
</style>
</head>
<body>

<div class="app-layout">
  <aside class="sidebar">
    <div class="sidebar-header"><h2>📺 TVG — Canais</h2></div>
    <div class="carousel-container">
      <button class="scroll-btn" onclick="rolar(-240)">&#10094;</button>
      <div class="cards-wrapper" id="cardsWrapper"></div>
      <button class="scroll-btn" onclick="rolar(240)">&#10095;</button>
    </div>
  </aside>

  <main class="player-section">
    <div class="player-top-bar">
      <div class="channel-info">
        <span style="color:var(--accent);font-size:1rem">●</span>
        <span id="current-channel-title">Selecione um canal</span>
      </div>
      <div class="controls">
        <button class="control-btn" title="Tela Cheia" onclick="toggleFullscreen()">
          <svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
        </button>
      </div>
    </div>
    <div class="iframe-container" id="iframe-container">
      <div class="placeholder-screen" id="placeholder">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <polygon points="5 3 19 12 5 21 5 3"/>
        </svg>
        <p style="font-size:.85rem;margin-top:10px">Toque em um canal para iniciar</p>
      </div>
      <iframe id="main-iframe" src="" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen referrerpolicy="no-referrer"></iframe>
    </div>
  </main>
</div>

<div class="bottom-bar">
  <button id="pwa_btn" onclick="pwaInstall()">📲 Instalar TVG</button>
</div>

<script>
const pwaBtn = document.getElementById('pwa_btn');
let pwaDeferred = null;

// ✅ PWA — verifica se já está instalado/rodando como app
function checkIfAppMode(){
  if((window.matchMedia('(display-mode: standalone)').matches || 
      window.matchMedia('(display-mode: fullscreen)').matches ||
      window.navigator.standalone === true) ||
      localStorage.getItem('tvg_installed') === 'yes'){
    pwaBtn.classList.add('hidden');
    return true;
  }
  return false;
}

function markAsInstalled(){
  localStorage.setItem('tvg_installed', 'yes');
  pwaBtn.classList.add('hidden');
  pwaDeferred = null;
}

// ✅ MANIFEST PWA EMBUTIDO — igual ao método do Anote
function pwaManifest(){
  const m = {
    name: 'TVG',
    short_name: 'TVG',
    start_url: '/tv/',
    display: 'standalone',
    background_color: '#0a1929',
    theme_color: '#0a1929',
    icons: [{
      src: '/tv/icon.svg',
      sizes: '512x512',
      type: 'image/svg+xml',
      purpose: 'any'
    }]
  };
  const blob = new Blob([JSON.stringify(m)], {type: 'application/manifest+json'});
  let link = document.getElementById('pwa_manifest');
  if(!link){
    link = document.createElement('link');
    link.id = 'pwa_manifest';
    link.rel = 'manifest';
    document.head.appendChild(link);
  }
  link.href = URL.createObjectURL(blob);
}

// ✅ Eventos PWA
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  pwaDeferred = e;
  checkIfAppMode();
});

window.addEventListener('appinstalled', markAsInstalled);
window.addEventListener('load', () => {
  pwaManifest(); // Gera o manifesto logo cedo
  checkIfAppMode();
});

// ✅ Função de instalação
function pwaInstall(){
  if(pwaDeferred){
    pwaDeferred.prompt();
    pwaDeferred.userChoice.then(result => {
      if(result.outcome === 'accepted') markAsInstalled();
      pwaDeferred = null;
    });
  }else{
    const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
    alert(isIOS
      ? '📲 Compartilhar → Adicionar à Tela de Início'
      : '📲 Menu ⋮ → Adicionar à tela inicial');
  }
}

function girarTelaPaisagem(){
  if(screen.orientation?.lock){
    screen.orientation.lock('landscape').catch(()=>{});
  }
}
function girarTelaRetrato(){
  screen.orientation?.unlock?.();
}

document.addEventListener('fullscreenchange', () => {
  if(document.fullscreenElement) girarTelaPaisagem();
  else girarTelaRetrato();
});

const channelData = [
  {id:"globosp",name:"Globo SP"},{id:"record",name:"Record TV"},
  {id:"sbt",name:"SBT"},{id:"redetv",name:"RedeTV!"},
  {id:"band",name:"Band"},{id:"bandsp",name:"Band SP"},
  {id:"cnnbrasil",name:"CNN Brasil"},{id:"recordnews",name:"Record News"},
  {id:"bandnews",name:"Band News"},{id:"espn",name:"ESPN"},
  {id:"espn2",name:"ESPN 2"},{id:"espn3",name:"ESPN 3"},
  {id:"espn4",name:"ESPN 4"},{id:"sportv",name:"SporTV"},
  {id:"sportv2",name:"SporTV 2"},{id:"sportv3",name:"SporTV 3"},
  {id:"premiere7",name:"Premiere"},{id:"combate",name:"Combate"},

  {id:"axn",name:"AXN"},{id:"sonychannel",name:"Sony"},
  {id:"warnerchannel",name:"Warner"},{id:"comedycentral",name:"Comedy"},
  {id:"ae",name:"A&E"},{id:"discoverychannel",name:"Discovery"},
  {id:"discoveryhh",name:"Discovery H&H"},{id:"discoveryscience",name:"Discovery Science"},
  {id:"discoveryturbo",name:"Discovery Turbo"},{id:"history",name:"History"},
  {id:"history2",name:"History 2"},{id:"animalplanet",name:"Animal Planet"},
  {id:"off",name:"Canal Off"},{id:"gnt",name:"GNT"},
  {id:"cartoonnetwork",name:"Cartoon"},{id:"cartoonito",name:"Cartoonito"},
  {id:"discoverykids",name:"Discovery Kids"},{id:"nickelodeon",name:"Nickelodeon"},
  {id:"nickjr",name:"Nick Jr."},{id:"disneyplus",name:"Disney+"},
  {id:"paramountplus",name:"Paramount+"}
];

const wrapper = document.getElementById('cardsWrapper');
const mainIframe = document.getElementById('main-iframe');
const placeholder = document.getElementById('placeholder');
const channelTitle = document.getElementById('current-channel-title');
const BASE_URL = "https://sinalpublicoetv.vercel.app/?id=";

function rolar(qtd){ wrapper.scrollBy({left:qtd,behavior:'smooth'}) }

function renderCanais(){
  wrapper.innerHTML = "";
  channelData.forEach(ch => {
    const card = document.createElement('button');
    card.className = 'channel-card';
    
    const logoUrl = getLogoUrl(ch.id);
    const init = ch.name.replace(/[^a-zA-Z]/g,'').substring(0,2).toUpperCase() || 'TV';
    
    const ctn = document.createElement('div');
    ctn.className = 'logo-container';
    
    const fb = document.createElement('div');
    fb.className = 'channel-logo-fallback';
    fb.textContent = init;
    ctn.appendChild(fb);
    
    if(logoUrl){
      const img = document.createElement('img');
      img.src = logoUrl;
      img.alt = ch.name;
      img.className = 'channel-logo';
      img.onload = () => fb.style.display = 'none';
      img.onerror = () => { img.style.display = 'none'; fb.style.display = 'flex'; };
      ctn.appendChild(img);
    }
    
    card.appendChild(ctn);
    card.onclick = () => abrirCanal(ch.id, ch.name, card);
    wrapper.appendChild(card);
  });
}

function abrirCanal(id, nome, cardEl){
  channelTitle.textContent = nome;
  placeholder.style.display = 'none';
  mainIframe.style.display = 'block';
  mainIframe.src = BASE_URL + id + '&t=' + Date.now();
  
  document.querySelectorAll('.channel-card').forEach(c => c.classList.remove('active'));
  cardEl.classList.add('active');
  cardEl.scrollIntoView({behavior:'smooth',block:'nearest'});
  
  setTimeout(() => {
    if(!document.fullscreenElement){
      document.getElementById('iframe-container').requestFullscreen?.()
        .then(girarTelaPaisagem)
        .catch(()=>{});
    }
  }, 400);
}

function toggleFullscreen(){
  const c = document.getElementById('iframe-container');
  if(!document.fullscreenElement){
    c.requestFullscreen?.().then(girarTelaPaisagem).catch(()=>{});
  }else{
    document.exitFullscreen?.();
    girarTelaRetrato();
  }
}

renderCanais();
</script>
